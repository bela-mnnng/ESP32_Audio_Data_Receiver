; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev    ; "pio run" baut nur das Board; native ist nur für "pio test -e native"

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.partitions = huge_app.csv   ; A2DP + WLAN passen nicht in die Standardpartition
build_unflags = -DCORE_DEBUG_LEVEL=0    ; Standardwert des Frameworks entfernen, sonst Warnung "redefined"
build_flags = -DCORE_DEBUG_LEVEL=2      ; hohe Log-Level verschlechtern den Ton
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP
    https://github.com/pschatzmann/arduino-audio-tools
    https://github.com/pschatzmann/arduino-audio-driver
    bblanchon/ArduinoJson@^7

; Unit-Tests am PC (mode_fsm, spotify_parser)
[env:native]
platform = native
test_framework = unity
lib_deps = bblanchon/ArduinoJson@^7